name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scoped for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: the prebuild step imports lib/docs.ts from a .mjs script so
          # the route table has one definition, and only Node >=23.6 strips types
          # from an imported .ts without a flag. On 20 the build dies with
          # ERR_UNKNOWN_FILE_EXTENSION before Next is ever invoked. Kept in step
          # with .nvmrc and package.json engines — do not lower it in isolation.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build static export
        env:
          PAGES_BASE_PATH: /loop-lab
          # Absolute origin for OG/Twitter tags — the real project-site URL.
          NEXT_PUBLIC_SITE_URL: https://ayeshakhalid192007-dev.github.io/loop-lab
        run: npm run build
      - name: Disable Jekyll (serve _next/*)
        run: touch ./out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
